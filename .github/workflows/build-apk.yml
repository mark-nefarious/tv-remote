name: Build APK

# main = the working remote everyone uses: every push publishes a release, which the
#        in-app "Update available" banner picks up.
# dev  = work in progress: every push publishes a pre-release (dev-N) for testing.
#        Pre-releases never trigger the update banner.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Monotonic versionCode so each APK is a strict upgrade of the last.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild -p android --no-install

      - name: Check release signing key is stable
        # Updates only install over each other if every build is signed with the same key.
        run: |
          grep -q "storeFile file('debug.keystore')" android/app/build.gradle
          test -f android/app/debug.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - run: cp android/app/build/outputs/apk/release/app-release.apk tv-remote.apk

      # PRs: downloadable artifact for testing before merge. No release.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tv-remote-pr${{ github.event.pull_request.number }}-build${{ github.run_number }}
          path: tv-remote.apk
          retention-days: 14

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Remote build ${{ github.run_number }}
          files: tv-remote.apk
          make_latest: true

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: TV Remote dev build ${{ github.run_number }} (testing)
          files: tv-remote.apk
          prerelease: true
          make_latest: false
